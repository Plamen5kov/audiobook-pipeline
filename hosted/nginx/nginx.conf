events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS. Without it nginx resolves an upstream hostname once,
    # at startup, and keeps the address forever: rebuilding backend or frontend
    # gives the new container a new IP and every request 502s until nginx is
    # restarted. Naming the upstream in a variable forces a fresh lookup, and
    # the short validity keeps a recreated container reachable within seconds.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        auth_basic "Audiobook Pipeline";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location ~ ^/(voices|audio|status|api|health) {
            set $studio_backend "backend";
            # With a variable in proxy_pass nginx no longer appends the matched
            # URI, so it has to be passed explicitly.
            proxy_pass         http://$studio_backend:3000$request_uri;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            client_max_body_size 50M;
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $studio_frontend "frontend";
            proxy_pass http://$studio_frontend:80$request_uri;
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
